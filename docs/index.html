<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a26">
<title>smartmeter</title>
<meta name="description" content="A metered, multi-socket charging box for e-rickshaws and e-bikes. Interactive proof-of-concept preview.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="3D parking lot with a four-socket charging box, e-rickshaws, a Host and Drivers"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>smartmeter</b><small>Proof-of-concept preview</small></div></div>
  <div class="seg" role="group" aria-label="View">
    <button data-mode="life" class="on" aria-pressed="true">Real life</button>
    <button data-mode="hardware" aria-pressed="false">Hardware</button>
    <button data-mode="software" aria-pressed="false">Software</button>
  </div>
</header>

<aside class="panel" id="panel">
  <div class="kicker"><span id="stepNo">Step 1 of 7</span><span class="hint">Drag to look around</span></div>
  <h1 id="stepTitle"></h1>
  <p id="stepBody"></p>
  <div class="dots" id="dots" role="tablist" aria-label="Steps"></div>
  <div class="ctrl">
    <button id="prev" aria-label="Previous step">Back</button>
    <button id="play" class="primary" aria-label="Play or pause">Pause</button>
    <button id="next" aria-label="Next step">Next</button>
  </div>
  <p class="foot"><a href="https://github.com/gunjannandy/smartmeter">Repository</a> · <a href="https://github.com/gunjannandy/smartmeter/blob/main/docs/DECISIONS.md">What is decided</a> · Simulated: no real hardware yet.</p>
</aside>

<section id="fallback" hidden>
  <h1>smartmeter</h1>
  <p>This preview needs WebGL, which this browser does not offer. Here is the idea in words and a picture.</p>
  <svg viewBox="0 0 640 260" role="img" aria-label="Four e-rickshaws parked in front of a charging box on a wall">
    <rect width="640" height="260" fill="#16283a"/><rect y="190" width="640" height="70" fill="#26303b"/>
    <rect x="190" y="40" width="260" height="120" rx="8" fill="#2c3f55"/>
    <rect x="270" y="70" width="100" height="70" rx="6" fill="#e8eef3"/>
    <g fill="#2fd37a"><circle cx="290" cy="84" r="5"/><circle cx="313" cy="84" r="5"/><circle cx="337" cy="84" r="5"/><circle cx="350" cy="84" r="5"/></g>
    <g fill="#f5b942"><rect x="95" y="170" width="70" height="46" rx="10"/><rect x="215" y="170" width="70" height="46" rx="10"/><rect x="335" y="170" width="70" height="46" rx="10"/><rect x="455" y="170" width="70" height="46" rx="10"/></g>
    <g stroke="#3d8bff" stroke-width="3" fill="none"><path d="M290 140 C 240 170,150 150,130 170"/><path d="M313 140 C 290 170,260 150,250 170"/><path d="M337 140 C 350 170,370 150,370 170"/><path d="M350 140 C 420 170,480 150,490 170"/></g>
  </svg>
  <ol id="fallbackSteps"></ol>
  <p><a href="https://github.com/gunjannandy/smartmeter">Repository</a></p>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
